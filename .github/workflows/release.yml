name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.2.1

permissions:
  contents: read

concurrency:
  group: sheetdiff-release
  cancel-in-progress: false

jobs:
  profile:
    if: github.repository == 'po-et/dsh-sheet-diff'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: ['0.2.1-rc.2', '0.2.1-rc.3']
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.2.1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package version
        run: test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
      - run: npm ci --ignore-scripts
      - run: npm install --global pnpm@11.7.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Install official Harness runtime
        env:
          HARNESS_VERSION: ${{ matrix.harness }}
        run: npm install --prefix "$RUNNER_TEMP/harness" --ignore-scripts --registry=https://registry.npmjs.org "@deepseek-ai/dsh@$HARNESS_VERSION"
      - name: Accept packed release through a fresh profile
        run: |
          mkdir profile-artifacts
          npm pack --ignore-scripts --pack-destination profile-artifacts
          npm run smoke:profile -- "$RUNNER_TEMP/harness/node_modules/@deepseek-ai/dsh" "$PWD"/profile-artifacts/dsh-sheet-diff-*.tgz
  release:
    if: github.repository == 'po-et/dsh-sheet-diff'
    needs: profile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.2.1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package version
        run: test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run smoke:host
      - name: Pack and checksum
        run: |
          mkdir release-artifacts
          npm pack --ignore-scripts --pack-destination release-artifacts
          node scripts/demo.js --out release-artifacts/sample
          (cd release-artifacts/sample && zip -q ../sheetdiff-demo-${RELEASE_TAG#v}.zip index.html report.html report.json orders-before.xlsx orders-after.xlsx README.txt)
          cd release-artifacts
          sha256sum dsh-sheet-diff-*.tgz sheetdiff-demo-*.zip > SHA256SUMS
      - name: Publish versioned bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/dsh-sheet-diff-*.tgz release-artifacts/sheetdiff-demo-*.zip release-artifacts/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "SheetDiff $RELEASE_TAG" --notes-file CHANGELOG.md
